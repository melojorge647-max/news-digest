name: Daily Marketing News Digest

on:
  schedule:
    - cron: '0 11 * * *'   # 7:00 AM EDT (UTC-4) — Morning
    - cron: '0 2 * * *'    # 10:00 PM EDT (UTC-4) — Evening
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which edition to send'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  morning-digest:
    if: github.event.schedule == '0 11 * * *' || (github.event_name == 'workflow_dispatch' && inputs.slot == 'morning')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Send morning digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ARTICLE_OFFSET: '0'
        run: python news_digest.py

  evening-digest:
    if: github.event.schedule == '0 2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.slot == 'evening')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Send evening digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ARTICLE_OFFSET: '10'
        run: python news_digest.py
